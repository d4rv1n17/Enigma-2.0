# Builds EnigmaCube-Setup-<version>.exe on GitHub's Windows machines.
# Open the "Actions" tab and download the installer from the "EnigmaCube-Setup"
# artifact. Pushing a tag such as v3.0 also attaches it to a GitHub Release.
name: Build Windows installer

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build installer
        run: python installer/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: EnigmaCube-Setup
          path: Output/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
