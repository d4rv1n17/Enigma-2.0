# Builds EnigmaCube-Setup-<version>.exe on GitHub's Windows machines.
# Open the "Actions" tab and download the installer from the "EnigmaCube-Setup"
# artifact. Pushing a tag such as v3.0 also attaches it to a GitHub Release.
name: Build Windows installer

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Do not show Windows error dialogs (they would hang the job)
        shell: pwsh
        run: |
          New-Item -Force -Path "HKCU:\Software\Microsoft\Windows\Windows Error Reporting" | Out-Null
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\Windows Error Reporting" -Name DontShowUI -Value 1 -Type DWord
      - name: GUI self-test (source)
        timeout-minutes: 5
        run: python main.py --selftest screenshots
      - name: Build installer
        run: python installer/build.py
      - name: GUI self-test (built exe)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\EnigmaCube\EnigmaCube.exe" -ArgumentList "--selftest", "$PWD\screenshots_exe" -PassThru
          $null = $p.Handle  # needed so that ExitCode is available later
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; "self-test timed out"; Get-Content screenshots_exe\steps.txt -ErrorAction SilentlyContinue; exit 1 }
          Get-Content screenshots_exe\steps.txt -Tail 3 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Get-Content screenshots_exe\error.txt, screenshots_exe\fault.txt -ErrorAction SilentlyContinue; exit 1 }
      - name: Install, run and uninstall with the built setup
        timeout-minutes: 8
        shell: pwsh
        run: |
          $setup = (Get-ChildItem Output\EnigmaCube-Setup-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP "Enigma Cube"
          $p = Start-Process -FilePath $setup -ArgumentList "--quiet", "--dir", "`"$dir`"" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; "setup timed out"; exit 1 }
          if ($p.ExitCode -ne 0) { "setup exit code $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path (Join-Path $dir "EnigmaCube.exe"))) { "EnigmaCube.exe was not installed"; exit 1 }
          "installed: $((Get-ChildItem $dir -Recurse | Measure-Object).Count) files"
          $app = Join-Path $dir "EnigmaCube.exe"
          $shots = Join-Path $PWD "screenshots_installed"
          $p = Start-Process -FilePath $app -ArgumentList "--selftest", "`"$shots`"" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; "installed app timed out"; exit 1 }
          if ($p.ExitCode -ne 0) { "installed app self-test failed"; exit 1 }
          $p = Start-Process -FilePath $app -ArgumentList "--uninstall", "--quiet" -PassThru
          $null = $p.WaitForExit(60000)
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { "uninstall did not remove the app"; exit 1 }
          "install / run / uninstall OK"
      - name: Size report
        shell: pwsh
        run: |
          Get-ChildItem Output\*.exe | ForEach-Object { "{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          "{0:N1} MB app folder" -f ((Get-ChildItem dist\EnigmaCube -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          Get-ChildItem Output\*.exe | ForEach-Object { "{0:N1}" -f ($_.Length / 1MB) } | Out-File -Encoding ascii screenshots\setup_size_mb.txt
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "shots"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item screenshots\* $d -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $d "exe") | Out-Null
          Copy-Item screenshots_exe\* (Join-Path $d "exe") -ErrorAction SilentlyContinue
          Set-Location $d
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "CI screenshots for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: EnigmaCube-Setup
          path: Output/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
