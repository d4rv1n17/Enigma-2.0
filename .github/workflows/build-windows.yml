# Builds EnigmaCube-Setup-*.exe on GitHub's Windows machines.
# Push to GitHub, open the "Actions" tab and download the installer
# from the "EnigmaCube-Setup" artifact. Tagging a commit v2.1 etc. also
# attaches the installer to a GitHub Release.
name: Build Windows installer

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name EnigmaCube --icon assets\app.ico --add-data "assets;assets" --version-file installer\version_info.txt main.py
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\EnigmaCube.iss
      - uses: actions/upload-artifact@v4
        with:
          name: EnigmaCube-Setup
          path: Output/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
