name: Debug exit crash
on:
  push:
    branches: [debug-exit]
jobs:
  probe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: No error dialogs
        shell: pwsh
        run: |
          New-Item -Force -Path "HKCU:\Software\Microsoft\Windows\Windows Error Reporting" | Out-Null
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\Windows Error Reporting" -Name DontShowUI -Value 1 -Type DWord
      - name: selftest
        id: st
        continue-on-error: true
        timeout-minutes: 5
        run: python main.py --selftest shots
      - name: CRASHED
        if: steps.st.outcome == 'failure'
        run: echo crashed
