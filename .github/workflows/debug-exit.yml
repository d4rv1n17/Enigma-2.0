name: Debug exit crash
on:
  push:
    branches: [debug-exit]
jobs:
  probe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
        v: ["branch"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.v == 'main' && 'fa891bade32b2ac75458c80634740515fc2962f6' || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: No error dialogs
        shell: pwsh
        run: |
          New-Item -Force -Path "HKCU:\Software\Microsoft\Windows\Windows Error Reporting" | Out-Null
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\Windows Error Reporting" -Name DontShowUI -Value 1 -Type DWord
      - name: selftest
        id: st
        timeout-minutes: 5
        env:
          ET_SKIP: ${{ matrix.v == 'nowin' && 'w_training,w_reference,w_achievements,w_timer' || (matrix.v == 'nosetup' && 'setup' || (matrix.v == 'noovq' && 'ov,quiz' || '')) }}
          ET_MENU: ${{ matrix.v == 'nomenu' && 'none' || 'popgrab' }}
        shell: pwsh
        run: |
          python main.py --selftest shots
          $c = $LASTEXITCODE
          "code=$c" >> $env:GITHUB_OUTPUT
          $f = (Get-Content shots\fault.txt -Raw)
          if ($f -and $f.Contains("violation")) { "av=1" >> $env:GITHUB_OUTPUT } else { "av=0" >> $env:GITHUB_OUTPUT }
          $last = (Get-Content shots\steps.txt -Tail 1)
          if ($last -eq "exit 0") { "done=1" >> $env:GITHUB_OUTPUT } else { "done=0" >> $env:GITHUB_OUTPUT }
          exit 0
      - name: EXIT_ZERO
        if: steps.st.outputs.code == '0'
        run: echo ok
      - name: EXIT_AV
        if: steps.st.outputs.code == '-1073741819'
        run: echo av
      - name: EXIT_ONE
        if: steps.st.outputs.code == '1'
        run: echo one
      - name: FAULT_LOGGED
        if: steps.st.outputs.av == '1'
        run: echo fault
      - name: STEPS_DONE
        if: steps.st.outputs.done == '1'
        run: echo done
